<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img" aria-label="Moving the dial shifts reasoning from the AI to the person" font-size="13">
<rect width="760" height="332" fill="#ffffff"/><style>text{font-family:Geist,system-ui,sans-serif}.f-ink{fill:#141815}.f-quiet{fill:#6b756e}.f-acc{fill:#1f7a4f}.f-tint{fill:#e8f3ec}.s-acc{stroke:#1f7a4f}.s-edge{stroke:#9aa49d}.s-rule{stroke:#e3e7e3}</style><defs><marker id="dial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"/></marker></defs>
<text x="24" y="28" font-size="15" font-weight="600" class="f-ink">Moving the dial shifts reasoning from the AI to the person</text>
<line x1="132" y1="92" x2="680" y2="92" class="s-acc" stroke-width="2" marker-end="url(#dial-arrow)"/>
<text x="24" y="96" font-size="11.5" class="f-quiet">AI does more</text>
<text x="504" y="118" text-anchor="middle" font-size="11.5" class="f-quiet">Person does more of the thinking</text>
<g><circle cx="132" cy="92" r="9" class="f-tint s-acc" stroke-width="2"/><line x1="132" y1="101" x2="132" y2="136" class="s-edge" stroke-width="1.25"/><rect x="24" y="136" width="216" height="104" rx="8" fill="none" class="s-edge" stroke-width="1.25"/><line x1="40" y1="192" x2="224" y2="192" class="s-rule"/>
<text x="132" y="74" text-anchor="middle" font-weight="600" class="f-ink">AI leads</text><text x="40" y="160" class="f-ink">Reasons: AI</text><text x="40" y="180" class="f-ink">Checks: person (optional)</text><text x="40" y="212" font-size="11.5" class="f-quiet">Proposes and acts; the</text><text x="40" y="228" font-size="11.5" class="f-quiet">person reviews if they choose</text></g>
<g><circle cx="380" cy="92" r="9" class="f-tint s-acc" stroke-width="2"/><line x1="380" y1="101" x2="380" y2="136" class="s-edge" stroke-width="1.25"/><rect x="272" y="136" width="216" height="104" rx="8" fill="none" class="s-edge" stroke-width="1.25"/><line x1="288" y1="192" x2="472" y2="192" class="s-rule"/>
<text x="380" y="74" text-anchor="middle" font-weight="600" class="f-ink">AI checks with me</text><text x="288" y="160" class="f-ink">Reasons: AI and person</text><text x="288" y="180" class="f-ink">Checks: both</text><text x="288" y="212" font-size="11.5" class="f-quiet">Pauses at key decisions and</text><text x="288" y="228" font-size="11.5" class="f-quiet">asks for the person's view</text></g>
<g><circle cx="628" cy="92" r="9" class="f-tint s-acc" stroke-width="2"/><line x1="628" y1="101" x2="628" y2="136" class="s-edge" stroke-width="1.25"/><rect x="520" y="136" width="216" height="104" rx="8" fill="none" class="s-edge" stroke-width="1.25"/><line x1="536" y1="192" x2="720" y2="192" class="s-rule"/>
<text x="628" y="74" text-anchor="middle" font-weight="600" class="f-ink">I lead</text><text x="536" y="160" class="f-ink">Reasons: person</text><text x="536" y="180" class="f-ink">Checks: AI</text><text x="536" y="212" font-size="11.5" class="f-quiet">Stays silent unless it</text><text x="536" y="228" font-size="11.5" class="f-quiet">detects a likely error</text></g>
<rect x="24" y="264" width="712" height="44" rx="8" class="f-tint s-edge" stroke-width="1.25"/><text x="380" y="291" text-anchor="middle" class="f-ink">Optional at any level: consented vigilance probes (Section 3.2)</text>
</svg>